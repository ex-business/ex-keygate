<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>账号与验证器设置 · ExKeyGate</title><link rel="stylesheet" href="/account.css"><script defer src="/account.js"></script></head><body><header><a href="/manage#verification">K · ExKeyGate</a><span>账号与验证器设置</span><a href="/login">登录管理平台</a></header><main><h1>账号与验证器设置</h1><p>本人修改密码，或凭已审批的一次性交付码绑定、换绑与恢复验证器。</p><div id="message" role="status" hidden></div><section><h2>本人修改密码</h2><p>需要已登录、近期本人验证及当前密码。成功后旧会话失效，请重新登录。</p><form id="password"><label>当前密码<input name="oldPassword" type="password" autocomplete="current-password" required maxlength="1024"></label><label>新密码<input name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required></label><label>确认新密码<input name="confirm" type="password" autocomplete="new-password" minlength="12" required></label><button>更新本人密码</button></form></section><section><h2>已审批的验证器设置</h2><p>请从授权管理员取得交付码。正常换绑需要原有 MFA；丢失恢复必须由管理员明确发起恢复方案。交付码具有恢复权限，请勿发给他人。</p><form id="open-setup"><label>一次性交付码<input id="setup-token" name="token" type="password" autocomplete="off" required maxlength="64"></label><button>读取已审批方案</button></form><div id="setup" hidden><div id="summary"></div><h3>新验证器</h3><form id="add-factor"><label>验证方式<select name="method"></select></label><label>名称<input name="label" required maxlength="128" placeholder="例如：我的安全验证器"></label><label>邮件地址或国际区号手机号<input name="reference" autocomplete="off" maxlength="2048" placeholder="TOTP 和硬件密钥留空"></label><button>准备并验证新绑定</button></form><div id="factors"></div><form id="complete"><div id="new-password" hidden><label>设置新密码<input name="newPassword" type="password" minlength="12" maxlength="1024" autocomplete="new-password"></label><label>确认新密码<input name="confirm" type="password" autocomplete="new-password"></label></div><button>完成设置并使旧会话失效</button></form></div></section></main></body></html>
