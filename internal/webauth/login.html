<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · ExKeyGate</title><link rel="stylesheet" href="/login.css"><script src="/login.js" defer></script></head><body>
<header><a href="/login" class="brand"><b>K</b><strong>ExKeyGate</strong><span>密钥与认证</span></a></header>
<main><section class="intro"><span class="eyebrow">EX BUSINESS · KEYGATE</span><h1>安全访问，<br>从身份验证开始。</h1><p>统一管理客户端、密钥与多人授权。<br>每一次关键操作，都由明确的身份和权限保障。</p><div class="features"><span>身份验证</span><span>多人审批</span><span>全程审计</span></div></section>
<section class="card" aria-labelledby="title"><div class="steps"><span id="step-password" class="active">1 账号登录</span><i></i><span id="step-mfa">2 安全验证</span></div><h2 id="title">登录管理平台</h2><p id="subtitle">使用你的管理账号继续。</p><div id="error" role="alert" hidden></div><p id="loading" role="status">正在检查登录状态…</p>
<form id="password-form" hidden><label for="username">账号</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="128" placeholder="请输入账号"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024" placeholder="请输入密码"><button type="submit" id="submit-password">登录并继续验证</button></form>
<section id="verification" hidden><div id="factors"></div><p class="note">须完成本人配置的验证组合后，才能进入管理平台。</p><button type="button" id="cancel-login" class="plain">取消登录</button></section>
<div id="sso-section" hidden><div class="divider"><span>其他登录方式</span></div><a class="sso" href="/auth/login">使用企业 SSO 登录 <span aria-hidden="true">→</span></a><p id="sso-note" class="note" hidden>当前 SSO 为本机模拟身份源，仅供开发测试。</p></div><p class="help">账号、密码或验证设备不可用？请联系管理员按受控流程恢复。</p>
</section></main><footer>Ex 系列 · 安全基础服务</footer></body></html>
